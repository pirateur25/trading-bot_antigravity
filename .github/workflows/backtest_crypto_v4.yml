name: Backtest CRYPTO V4 (SMC Futures)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Cryptos Futures à backtester (les 4 majeures rentables par défaut)"
        default: "BTC,ETH,AVAX,INJ"
      start:
        description: "Date de début (AAAA-MM-JJ)"
        default: "2022-01-01"
      end:
        description: "Date de fin (vide = jusqu'à aujourd'hui)"
        default: ""
      capital:
        description: "Capital de départ en USDT (ex: 600 pour 552-800 EUR)"
        default: "600"
      risk_pct:
        description: "Risque par trade en % du capital à l'instant t (1.5 = 1.5% du solde par SL ; 0 = marge fixe 200 USDT)"
        default: "1.5"
      compound:
        description: "Sizing dynamique en % du capital à l'instant t (oui = intérêts composés non bridés à 18 USDT ; non = fixe sur capital initial)"
        type: choice
        default: "oui"
        options: ["oui", "non"]
      fee_pct:
        description: "Frais par ordre en % du notionnel (0.02 = 0.02% futures standard, 0 = brut)"
        default: "0.02"
      trail_mode:
        description: "Mode de vérification du Trailing SL"
        type: choice
        default: "check_30m"
        options: ["check_30m", "intra"]
      params:
        description: "Réglages supplémentaires (ex: m15_max_range_pct=1.6;sl_cooldown_hours=2.0;block_same_poi=1)"
        default: ""

permissions:
  contents: write

jobs:
  backtest_crypto_v4:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Lancement du Backtest CRYPTO V4 (Téléchargement auto + Rapport Mensuel/Annuel + Telegram)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SYMBOLS: ${{ inputs.symbols }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          CAPITAL: ${{ inputs.capital }}
          RISK_PCT: ${{ inputs.risk_pct }}
          COMPOUND_IN: ${{ inputs.compound }}
          FEE_PCT: ${{ inputs.fee_pct }}
          TRAIL_MODE: ${{ inputs.trail_mode }}
          EXTRA_PARAMS: ${{ inputs.params }}
        run: |
          COMP_FLAG=1
          if [ "$COMPOUND_IN" = "non" ]; then COMP_FLAG=0; fi
          python backtest/run_crypto_v4.py \
            --symbols "$SYMBOLS" \
            --start "$START" \
            --end "$END" \
            --capital "$CAPITAL" \
            --risk_pct "$RISK_PCT" \
            --compound "$COMP_FLAG" \
            --fee_pct "$FEE_PCT" \
            --trail_mode "$TRAIL_MODE" \
            --params "$EXTRA_PARAMS" \
            --outdir results

      - name: Sauvegarde des données crypto téléchargées dans data/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv.gz || true
          git diff --cached --quiet || git commit -m "chore(data): cache historiques 5m Crypto V4 $(date -u +%Y-%m-%d)"
          git push || echo "Pas de nouvelles données à pousser"

      - name: Upload des résultats (CSV mensuel/annuel, rapport, graphiques, viewer_trades.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-crypto-v4
          path: results/

