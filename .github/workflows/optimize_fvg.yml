name: Optimisation FVG HTF + MSS (Optuna)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Paires (EURUSD,GBPUSD,USDCHF,USDJPY,XAUUSD)"
        default: "EURUSD,GBPUSD,USDCHF,USDJPY,XAUUSD"
      crypto:
        description: "Cryptos FTMO à ajouter (BTCUSD,ETHUSD,XRPUSD... téléchargées automatiquement ; vide = aucune)"
        default: ""
      n_trials:
        description: "Nombre d'essais Optuna"
        default: "300"
      split:
        description: "Début de la période TEST (jamais utilisée pour choisir)"
        default: "2024-01-01"
      fee:
        description: "Frais par ordre en % (-1 = frais FTMO réels par actif)"
        default: "-1"
      min_trades:
        description: "Trades visés par paire et par moitié (en dessous le score est réduit)"
        default: "25"
      freeze:
        description: "Leviers figés en plus 'k=v;k2=v2' (vide = défauts)"
        default: ""
      unfreeze:
        description: "Leviers à libérer, séparés par des virgules (ex: side pour tester long/short seul)"
        default: ""
      wall_time:
        description: "Durée max en minutes (max GitHub = 340)"
        default: "320"

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compilation du noyau C
        run: gcc -O3 -march=native -shared -fPIC -o backtest/_kernels.so backtest/kernels.c -lm
      - name: Création du dossier résultats
        run: mkdir -p results_opt
      - name: Optimisation (choix sur TRAIN, jugement sur TEST) + envoi Telegram du résumé et du JSON
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python backtest/optimize_fvg.py \
            --symbols "${{ inputs.symbols }}${{ inputs.crypto && ',' || '' }}${{ inputs.crypto }}" --n_trials "${{ inputs.n_trials }}" --split "${{ inputs.split }}" \
            --fee "${{ inputs.fee }}" --min_trades "${{ inputs.min_trades }}" --wall_time "${{ inputs.wall_time }}" \
            --freeze "${{ inputs.freeze }}" --unfreeze "${{ inputs.unfreeze }}" \
            --outdir results_opt 2>&1 | tee results_opt/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimisation-fvg
          path: results_opt/
